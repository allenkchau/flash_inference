[project]
name = "flash-inference"
version = "1.0.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Allen Chau" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "torch>=2.14.0",
    "transformers>=5.17.0",
]

[project.scripts]
flash-inference = "flash_inference:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flash_inference"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]


[tool.ruff]
target-version = "py312"
src = ["src", "tests"]
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "E501",  # line length; handled by the formatter
]

[tool.ruff.format]
quote-style = "double"

